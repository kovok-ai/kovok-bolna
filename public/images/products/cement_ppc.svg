<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="bagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="greenAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="shadowFold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bgGrad)"/>
  
  <g stroke="#334155" stroke-width="1" stroke-opacity="0.3">
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="450" x2="800" y2="450"/>
    <line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="600" y1="0" x2="600" y2="600"/>
  </g>

  <!-- 50kg PPC Cement Bag -->
  <g filter="url(#dropShadow)" transform="translate(240, 50)">
    <path d="M 40,20 C 70,10 250,10 280,20 C 310,35 325,120 320,380 C 315,440 280,455 240,460 C 180,465 140,465 80,460 C 40,455 5,440 0,380 C -5,120 10,35 40,20 Z" 
          fill="url(#bagGrad)" stroke="#94a3b8" stroke-width="2"/>
    
    <path d="M 40,20 C 90,32 230,32 280,20" stroke="#64748b" stroke-width="3" stroke-dasharray="4,3" fill="none"/>
    <path d="M 60,455 C 100,448 220,448 260,455" stroke="#64748b" stroke-width="4" stroke-dasharray="5,4" fill="none"/>

    <path d="M 12,90 C 120,95 200,95 308,90 L 312,185 C 200,190 120,190 8,185 Z" fill="url(#greenAccent)"/>
    
    <text x="160" y="125" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="1.5">PORTLAND POZZOLANA CEMENT</text>
    <text x="160" y="165" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" text-anchor="middle" letter-spacing="1">PPC (FLY ASH)</text>

    <g transform="translate(30, 210)" fill="#1e293b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
      <rect x="15" y="10" width="230" height="24" rx="4" fill="#e2e8f0" stroke="#cbd5e1"/>
      <text x="130" y="27" font-size="11" font-weight="800" text-anchor="middle" fill="#0f172a" letter-spacing="1.5">IS 1489 (PART 1):2015</text>
      
      <g transform="translate(95, 45)">
        <rect x="0" y="0" width="70" height="42" rx="4" fill="none" stroke="#1e293b" stroke-width="2.5"/>
        <text x="35" y="18" font-size="11" font-weight="900" text-anchor="middle">IS 1489</text>
        <line x1="8" y1="23" x2="62" y2="23" stroke="#1e293b" stroke-width="1.5"/>
        <text x="35" y="36" font-size="10" font-weight="700" text-anchor="middle">CM/L-000000</text>
      </g>

      <text x="130" y="115" font-size="11" font-weight="600" text-anchor="middle" fill="#475569">MINIMUM 28-DAY STRENGTH: 33.0 MPa</text>
      <text x="130" y="132" font-size="11" font-weight="600" text-anchor="middle" fill="#475569">FINENESS: &gt; 300 m²/kg (HIGH SURFACE)</text>
      <text x="130" y="149" font-size="11" font-weight="600" text-anchor="middle" fill="#475569">REDUCED HEAT OF HYDRATION</text>
      
      <rect x="55" y="170" width="150" height="40" rx="8" fill="#0f172a"/>
      <text x="130" y="196" fill="#ffffff" font-size="18" font-weight="900" text-anchor="middle">NET WT: 50 kg</text>
      <text x="130" y="224" font-size="9" font-weight="700" text-anchor="middle" fill="#64748b" letter-spacing="1">DURABLE MASS CONCRETE · PLASTERING</text>
    </g>
  </g>

  <g transform="translate(40, 510)">
    <rect width="720" height="60" rx="10" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1.5"/>
    <text x="24" y="28" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">Portland Pozzolana Cement Fly-ash Based (50kg Bag)</text>
    <text x="24" y="47" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">IS 1489 (Part 1):2015 · 20 Bags / Tonne · Sulfate resistant blended hydraulic cement</text>
    <rect x="580" y="14" width="116" height="30" rx="6" fill="#065f46" stroke="#10b981" stroke-width="1"/>
    <text x="638" y="34" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">VERIFIED SPEC</text>
  </g>
</svg>
