<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="drumBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="canisterGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bgGrad)"/>
  
  <g filter="url(#dropShadow)" transform="translate(180, 80)">
    <!-- 200L Industrial Chemical Drum (Background) -->
    <g transform="translate(180, 40)">
      <ellipse cx="120" cy="30" rx="110" ry="24" fill="#0369a1" stroke="#38bdf8" stroke-width="2"/>
      <rect x="10" y="30" width="220" height="300" fill="url(#drumBlue)"/>
      <ellipse cx="120" cy="330" rx="110" ry="24" fill="#0369a1"/>
      
      <!-- Drum Rolling Ribs -->
      <line x1="10" y1="120" x2="230" y2="120" stroke="#0284c7" stroke-width="8"/>
      <line x1="10" y1="220" x2="230" y2="220" stroke="#0284c7" stroke-width="8"/>
      
      <!-- Drum Bung Caps -->
      <circle cx="80" cy="30" r="12" fill="#0f172a" stroke="#64748b" stroke-width="2"/>
      <circle cx="160" cy="30" r="8" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>

      <!-- Drum Chemical Label -->
      <rect x="40" y="140" width="160" height="65" rx="4" fill="#ffffff" fill-opacity="0.95"/>
      <text x="120" y="162" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" text-anchor="middle">SUPERPLASTICIZER</text>
      <text x="120" y="178" fill="#0369a1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" text-anchor="middle">IS 9103 CONCRETE ADMIXTURE</text>
      <text x="120" y="194" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" text-anchor="middle">NET CONTENTS: 200 LITRES</text>
    </g>

    <!-- 20L Waterproofing Canister (Foreground) -->
    <g transform="translate(40, 160)">
      <rect x="10" y="50" width="140" height="170" rx="16" fill="url(#canisterGrad)" stroke="#94a3b8" stroke-width="2"/>
      <!-- Canister Handle -->
      <path d="M 40,50 L 40,25 Q 40,15 55,15 L 105,15 Q 120,15 120,25 L 120,50" fill="none" stroke="#64748b" stroke-width="10" stroke-linecap="round"/>
      <!-- Screw Cap -->
      <rect x="65" y="5" width="30" height="18" rx="3" fill="#dc2626" stroke="#b91c1c" stroke-width="1.5"/>
      
      <!-- Waterproofing Label -->
      <rect x="25" y="90" width="110" height="90" rx="6" fill="#0284c7"/>
      <text x="80" y="115" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" text-anchor="middle">INTEGRAL</text>
      <text x="80" y="132" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" text-anchor="middle">WATERPROOFING</text>
      <rect x="35" y="142" width="90" height="18" rx="3" fill="#ffffff"/>
      <text x="80" y="155" fill="#0284c7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="800" text-anchor="middle">IS 2645:2003</text>
      <text x="80" y="172" fill="#e0f2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" text-anchor="middle">20 LITRES</text>
    </g>
  </g>

  <g transform="translate(40, 500)">
    <rect width="720" height="70" rx="10" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1.5"/>
    <text x="24" y="30" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">Construction Chemicals &amp; Waterproofing</text>
    <text x="24" y="52" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">IS 2645 Integral Waterproofing Compounds &amp; IS 9103 Superplasticizers / Retarders</text>
    <rect x="580" y="19" width="116" height="32" rx="6" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1"/>
    <text x="638" y="40" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">STANDARD SPEC</text>
  </g>
</svg>
