<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="copperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
    <linearGradient id="wireRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="wireYellow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <linearGradient id="wireBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bgGrad)"/>
  
  <g filter="url(#dropShadow)" transform="translate(140, 90)">
    <!-- Heavy Duty PVC Conduit Pipe (Black) -->
    <g transform="translate(20, 60)">
      <rect x="60" y="30" width="480" height="42" rx="21" fill="#0f172a" stroke="#334155" stroke-width="2"/>
      <ellipse cx="60" cy="51" rx="10" ry="21" fill="#1e293b" stroke="#475569" stroke-width="2"/>
      <ellipse cx="60" cy="51" rx="6" ry="14" fill="#0f172a"/>
      <text x="260" y="56" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" letter-spacing="1">IS 9537 PART 3 · 25mm HEAVY DUTY RIGID CONDUIT</text>
    </g>

    <!-- FRLS Building Wires Coming Out (Phase Wires Red, Yellow, Blue, Earth Green) -->
    <g transform="translate(30, 150)">
      <!-- Red Phase Wire with Stripped Copper Tip -->
      <g transform="translate(0, 0)">
        <path d="M 60,30 Q 180,10 320,30 L 440,30" fill="none" stroke="url(#wireRed)" stroke-width="18" stroke-linecap="round"/>
        <!-- Stripped Multi-strand Copper Core -->
        <rect x="440" y="24" width="50" height="12" rx="3" fill="url(#copperGrad)"/>
      </g>
      
      <!-- Yellow Phase Wire -->
      <g transform="translate(0, 40)">
        <path d="M 60,30 Q 200,20 320,30 L 420,30" fill="none" stroke="url(#wireYellow)" stroke-width="18" stroke-linecap="round"/>
        <rect x="420" y="24" width="45" height="12" rx="3" fill="url(#copperGrad)"/>
      </g>

      <!-- Blue Phase Wire -->
      <g transform="translate(0, 80)">
        <path d="M 60,30 Q 160,40 320,30 L 450,30" fill="none" stroke="url(#wireBlue)" stroke-width="18" stroke-linecap="round"/>
        <rect x="450" y="24" width="50" height="12" rx="3" fill="url(#copperGrad)"/>
      </g>

      <!-- Wire Spec Badge -->
      <g transform="translate(180, 140)">
        <rect x="0" y="0" width="200" height="44" rx="6" fill="#0f172a" fill-opacity="0.9" stroke="#334155"/>
        <text x="100" y="18" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" text-anchor="middle">2.5 sq.mm FRLS COPPER</text>
        <text x="100" y="34" fill="#4ade80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" text-anchor="middle">IS 694:2010 FLAME RETARDANT</text>
      </g>
    </g>
  </g>

  <g transform="translate(40, 500)">
    <rect width="720" height="70" rx="10" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1.5"/>
    <text x="24" y="30" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">Electrical Construction Materials</text>
    <text x="24" y="52" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">IS 694:2010 FRLS Copper Building Wires &amp; IS 9537 Heavy-Duty Rigid PVC Conduits</text>
    <rect x="580" y="19" width="116" height="32" rx="6" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1"/>
    <text x="638" y="40" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">STANDARD SPEC</text>
  </g>
</svg>
