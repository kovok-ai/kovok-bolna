<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="boltShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="30%" stop-color="#cbd5e1"/>
      <stop offset="70%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bgGrad)"/>
  
  <g filter="url(#dropShadow)" transform="translate(180, 100)">
    <!-- Heavy Hex Structural Bolt Grade 10.9 -->
    <g transform="translate(40, 50)">
      <!-- Hexagonal Bolt Head -->
      <polygon points="40,90 80,40 140,40 180,90 140,140 80,140" fill="url(#boltShine)" stroke="#e2e8f0" stroke-width="2"/>
      
      <!-- Head Stamp Markings -->
      <text x="110" y="80" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" text-anchor="middle">10.9S</text>
      <text x="110" y="105" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" text-anchor="middle">IS 3757</text>

      <!-- Threaded Shank -->
      <rect x="180" y="65" width="260" height="50" rx="4" fill="url(#boltShine)" stroke="#64748b" stroke-width="1.5"/>
      
      <!-- Thread Grooves -->
      <g stroke="#334155" stroke-width="4">
        <line x1="280" y1="65" x2="280" y2="115"/>
        <line x1="295" y1="65" x2="295" y2="115"/>
        <line x1="310" y1="65" x2="310" y2="115"/>
        <line x1="325" y1="65" x2="325" y2="115"/>
        <line x1="340" y1="65" x2="340" y2="115"/>
        <line x1="355" y1="65" x2="355" y2="115"/>
        <line x1="370" y1="65" x2="370" y2="115"/>
        <line x1="385" y1="65" x2="385" y2="115"/>
        <line x1="400" y1="65" x2="400" y2="115"/>
        <line x1="415" y1="65" x2="415" y2="115"/>
        <line x1="430" y1="65" x2="430" y2="115"/>
      </g>
    </g>

    <!-- Structural Nut & Hardened Washer -->
    <g transform="translate(180, 180)">
      <!-- Washer -->
      <ellipse cx="60" cy="70" rx="55" ry="35" fill="#94a3b8" stroke="#cbd5e1" stroke-width="2"/>
      <ellipse cx="60" cy="70" rx="24" ry="15" fill="#1e293b"/>
      
      <!-- Hex Nut -->
      <polygon points="120,70 150,35 195,35 225,70 195,105 150,105" fill="url(#boltShine)" stroke="#e2e8f0" stroke-width="2"/>
      <circle cx="172" cy="70" r="16" fill="#1e293b"/>
      <text x="172" y="74" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="900" text-anchor="middle">10</text>
    </g>
  </g>

  <g transform="translate(40, 500)">
    <rect width="720" height="70" rx="10" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1.5"/>
    <text x="24" y="30" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">Structural Fasteners &amp; Hardware</text>
    <text x="24" y="52" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">IS 3757 High Strength Structural Bolts &amp; IS 6623 Hardened Washers (Grades 8.8 &amp; 10.9)</text>
    <rect x="580" y="19" width="116" height="32" rx="6" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1"/>
    <text x="638" y="40" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">STANDARD SPEC</text>
  </g>
</svg>
