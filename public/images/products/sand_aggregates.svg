<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="sandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <linearGradient id="graniteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bgGrad)"/>
  
  <g filter="url(#dropShadow)" transform="translate(140, 90)">
    <!-- 20mm Graded Granite Aggregate Mound -->
    <g transform="translate(240, 100)">
      <path d="M 40,240 Q 140,40 240,240 Z" fill="url(#graniteGrad)" stroke="#334155" stroke-width="2"/>
      <!-- Angular Stone Fragments -->
      <polygon points="120,110 145,95 160,120 135,135" fill="#cbd5e1" stroke="#64748b"/>
      <polygon points="80,160 110,140 125,170 95,190" fill="#94a3b8" stroke="#475569"/>
      <polygon points="160,170 190,150 205,185 175,200" fill="#cbd5e1" stroke="#64748b"/>
      <polygon points="110,200 135,185 150,215 125,230" fill="#64748b" stroke="#334155"/>
      <polygon points="190,120 215,105 230,135 205,150" fill="#94a3b8" stroke="#475569"/>

      <rect x="70" y="210" width="140" height="30" rx="6" fill="#0f172a" fill-opacity="0.9"/>
      <text x="140" y="230" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" text-anchor="middle">20mm GRANITE COARSE</text>
    </g>

    <!-- Manufactured Sand (M-Sand Zone II) Mound -->
    <g transform="translate(20, 100)">
      <path d="M 40,240 Q 140,70 240,240 Z" fill="url(#sandGrad)" stroke="#713f12" stroke-width="2"/>
      
      <!-- Fine Texture Stipple Dots -->
      <circle cx="110" cy="150" r="3" fill="#fef08a" opacity="0.6"/>
      <circle cx="130" cy="130" r="2.5" fill="#fef08a" opacity="0.6"/>
      <circle cx="150" cy="160" r="3" fill="#fef08a" opacity="0.6"/>
      <circle cx="170" cy="180" r="2.5" fill="#fef08a" opacity="0.6"/>
      <circle cx="120" cy="190" r="3" fill="#fef08a" opacity="0.6"/>
      <circle cx="90" cy="210" r="2.5" fill="#fef08a" opacity="0.6"/>

      <rect x="70" y="210" width="140" height="30" rx="6" fill="#0f172a" fill-opacity="0.9"/>
      <text x="140" y="230" fill="#fde047" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" text-anchor="middle">M-SAND (ZONE II)</text>
    </g>
  </g>

  <g transform="translate(40, 500)">
    <rect width="720" height="70" rx="10" fill="#1e293b" fill-opacity="0.9" stroke="#334155" stroke-width="1.5"/>
    <text x="24" y="30" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">Sand &amp; Coarse Aggregates</text>
    <text x="24" y="52" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">IS 383:2016 · Coarse &amp; Fine Aggregates for Concrete (10mm, 20mm &amp; Manufactured Sand)</text>
    <rect x="580" y="19" width="116" height="32" rx="6" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1"/>
    <text x="638" y="40" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">STANDARD SPEC</text>
  </g>
</svg>
