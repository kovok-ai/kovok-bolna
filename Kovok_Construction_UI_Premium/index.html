ontact alternative suppliers when the original supplier is short.</label><label class="checkline"><input type="checkbox"> Approve a price change or specification substitution automatically (not recommended).</label><label class="checkline"><input type="checkbox" checked> Escalate unresolved safety, specification or commercial conflicts.</label><div class="alert" style="margin-top:12px">Kovok may investigate and prepare options. It must not place an order or change an approved material/price without the required authority.</div></div></section></div>`}

if(s===5)body=`<div class="field section"><label>What do you currently use?</label><div class="tag-list">${['Excel / Google Sheets','WhatsApp','TallyPrime','ERPNext','Zoho','Other ERP / procurement software','No system yet'].map(x=>`<button type="button" class="tag ${x==='Excel / Google Sheets'||x==='WhatsApp'?'selected':''}" data-toggle-tag>${x}</button>`).join('')}</div></div><div class="field section"><label>How should Kovok get your supplier/product/order data?</label><select><option>Import CSV / Excel first</option><option>Connect existing system (supported connector)</option><option>Start standalone with Kovok records</option><option>Need help deciding</option></select></div><div class="alert">Kovok will show a workflow preview before activation. No live calls, purchases or system writes occur during setup.</div><div class="divider"></div><div class="setup-points"><div class="setup-point"><div class="stepnum">1</div><div><strong>Generated procurement profile</strong><p>Material schema, mandatory questions, supplier shortlist rules, quote fields and approval policy.</p></div></div><div class="setup-point"><div class="stepnum">2</div><div><strong>Workflow preview and test cases</strong><p>Normal purchase, missing specification, no supplier response, price change and delayed/short delivery.</p></div></div><div class="setup-point"><div class="stepnum">3</div><div><strong>Owner reviews and activates</strong><p>Only approved configuration is allowed to initiate live supplier calls.</p></div></div></div>`;
return `<div class="modal-head" style="padding:24px 24px 0;display:flex;justify-content:space-between"><div><div class="eyebrow">WORKSPACE CONFIGURATION · STEP ${s+1} OF 6</div><h2 id="modalTitle" style="font-size:23px;margin:0 0 5px">${titles[s]}</h2><p style="font-size:12px;color:var(--muted);margin:0">${captions[s]}</p></div><button class="icon-btn" data-action="close-modal">×</button></div><div class="wizard-main"><div class="stepper">${titles.map((t,i)=>`<div class="step ${i===s?'active':i<s?'done':''}"><span class="num">${i<s?'✓':i+1}</span><span class="crumb-full">${t}</span></div>`).join('')}</div>${body}</div><div class="wizard-footer"><span class="hint">Your answers create a reviewable rule profile, not an autonomous unrestricted agent.</span><div class="right-actions">${s>0?`<button class="btn btn-secondary" data-action="setup-back">Back</button>`:''}<button class="btn btn-primary" data-action="setup-next">${s===5?'Generate workflow preview':'Continue →'}</button></div></div>`}

rea></div>`;
if(s===3)body=`<div class="alert">Review before any supplier calls start. The system will use these exact terms to ask for comparable offers. No order is placed at this stage.</div><div class="panel" style="margin-top:15px;box-shadow:none"><div class="panel-head"><div><h2>${r.category==='tmt'?'TMT steel':r.category==='cement'?'Cement':'Construction material'} request</h2><p>Draft · Request-specific specifications</p></div>${status('Needs buyer confirmation','amber')}</div><div class="panel-body"><div class="kv"><span>Request description</span><strong>${r.description||'Structured request'}</strong></div>${(r.category==='tmt'?[['Grade',r.grade],['Diameter',r.diameter+' mm'],['Brand rule',r.brand]]:r.category==='cement'?[['Type','OPC/PPC/PSC — selected in form'],['Pack','50 kg or confirmed bulk']]:[['Category','Specification needs review']]).map(x=>`<div class="kv"><span>${x[0]}</span><strong>${x[1]}</strong></div>`).join('')}<div class="kv"><span>Quantity</span><strong>${r.quantity} ${r.unit}</strong></div><div class="kv"><span>Delivery</span><strong>${r.site} · ${r.pin} · ${r.date}</strong></div><div class="kv"><span>Sourcing strategy</span><strong>${r.suppliers} supplier${r.suppliers==='1'?'':'s'} · ${r.delivery}</strong></div></div></div><label class="checkline"><input type="checkbox" id="reviewConfirm"> I confirm the requirement is accurate and authorize Kovok to contact suppliers for quotations. This does not authorize an order.</label>`;
return `<div class="modal-head" style="padding:24px 24px 0;display:flex;justify-content:space-between"><div><div class="eyebrow">NEW PURCHASE REQUEST · STEP ${s+1} OF 4</div><h2 id="modalTitle" style="font-size:23px;margin:0 0 5px">${['What do you need?','Identify the material','Delivery & sourcing','Review and send'][s]}</h2><p style="font-size:12px;color:var(--muted);margin:0">${['Describe it in your own words. Kovok will ask for the missing details.','Confirm the attributes that make this the correct product.','Tell Kovok where and when it is needed.','Check all details before the supplier outreach starts.'][s]}</p></div><button class="icon-btn" data-action="close-modal">×</button></div><div class="wizard-main"><div class="stepper">${titles.map((t,i)=>`<div class="step ${i===s?'active':i<s?'done':''}"><span class="num">${i<s?'✓':i+1}</span><span class="crumb-full">${t}</span></div>`).join('')}</div>${body}</div><div class="wizard-footer"><span class="hint">Step ${s+1} of 4 · No order without approval.</span><div class="right-actions">${s>0?`<button class="btn btn-secondary" data-action="request-back">Back</button>`:''}<button class="btn btn-primary" data-action="request-next">${s===3?'Create request & start sourcing':'Continue →'}</button></div></div>`}
function recoveryModal(){return `<div class="modal-head" style="padding:24px"><div><div class="eyebrow">EXCEPTION · KOV-1028</div><h2 id="modalTitle" style="margin:0;font-size:22px">Recover the missing 8 tonnes</h2><p style="color:var(--muted);font-size:12px;line-height:1.5">Original supplier can deliver only 12 of 20 tonnes by the required date. The remainder is not covered.</p></div><button class="icon-btn" data-action="close-modal">×</button></div><div class="wizard-main"><div class="alert">All figures below are illustrative demo data. No supplier calls have been made.</div><div class="grid two-col" style="margin-top:15px"><div class="panel"><div class="panel-head"><h2>Verified facts</h2></div><div class="panel-body"><div class="kv"><span>Approved quantity</span><strong>20 tonnes</strong></div><div class="kv"><span>Supplier-confirmed quantity</span><strong>12 tonnes</strong></div><div class="kv"><span>Uncovered balance</span><strong>8 tonnes</strong></div><div class="kv"><span>Spec rule</span><strong>Fe 550D · 12 mm</strong></div><div class="kv"><span>Buyer authority</span><strong>Approval required</strong></div></div></div><div class="panel"><div class="panel-head"><h2>Recovery options</h2></div><div class="panel-body"><div class="attention-item"><div class="attention-icon">1</div><div><strong>Northline Metals</strong><p>8 tonnes claimed available · ETA tomorrow · delivered cost pending</p>${status('Needs quote','amber')}</div></div><div class="attention-item"><div class="attention-icon">2</div><div><strong>Delay balance shipment</strong><p>Original supplier estimates 2 additional days</p>${status('Schedule risk','red')}</div></div><button class="btn btn-primary" data-action="simulate-recovery" style="width:100%">Request verified alternative quote</button></div></div></div></div><div class="wizard-footer"><span class="hint">Kovok prepares alternatives; buyer decides.</span><button class="btn btn-secondary" data-action="close-modal">Close</button></div>`}
function productModal(){return `<div class="modal-head" style="padding:24px"><div><div class="eyebrow">CATALOGUE REVIEW</div><h2 id="modalTitle" style="margin:0;font-size:22px">Propose a product or mapping</h2><p style="color:var(--muted);font-size:12px">New records remain provisional until source evidence and required specifications are reviewed.</p></div><button class="icon-btn" data-action="close-modal">×</button></div><div class="wizard-main"><div class="form-grid"><div class="field"><label>Product name / buyer phrase *</label><input placeholder="e.g. TMT Fe 550D, 12 mm"></div><div class="field"><label>Category *</label><select><option>TMT / reinforcement steel</option><option>Cement</option><option>Other construction material</option></select></div><div class="field"><label>Manufacturer / brand (if known)</label><input placeholder="Brand or manufacturer"></div><div class="field"><label>Source URL / document reference</label><input placeholder="Manufacturer page, datasheet or supplier catalogue"></div></div><div class="field section"><label>Required specification evidence</label><textarea placeholder="Enter source-supported attributes and where each came from"></textarea></div><div class="alert">Image rights, source provenance, exact product identity and duplicate check are required before a provisional record can become verified.</div></div><div class="wizard-footer"><span class="hint">Creates a provisional record in demo state only.</span><button class="btn btn-primary" data-action="save-provisional">Save provisional record</button></div>`}
function importModal(){return `<div class="modal-head" style="padding:24px"><div><div class="eyebrow">DATA IMPORT</div><h2 id="modalTitle" style="margin:0;font-size:22px">Import a supplier or product list</h2><p style="color:var(--muted);font-size:12px">Use a mapping preview before data enters the shared catalogue.</p></div><button class="icon-btn" data-action="close-modal">×</button></div><div class="wizard-main"><div class="voice-panel"><div class="voice-orb">⇧</div><div><strong>Drop a CSV or Excel file</strong><p>Prototype placeholder. In production this will validate headers, units, duplicate candidates and source permissions before import.</p></div><button class="btn btn-secondary" data-action="fake-upload">Choose file</button></div><div class="alert">No file is uploaded by this prototype. The interface is illustrative until a backend import endpoint is connected.</div></div><div class="wizard-footer"><span class="hint">Preview → map fields → validate → import</span><button class="btn btn-secondary" data-action="close-modal">Cancel</button></div>`}
function infoModal(type){const map={'import-request':['Import purchase requests','Connect a CSV/XLSX source or paste requirements. No import is performed in this prototype.'],'connect-erpnext':['Connect ERPNext','Production setup will require server-side credentials, permissions and a tested sync mapping.'],'planned':['Connector planned','This connector is not implemented. Do not enter credentials into this prototype.'],'save-settings':['Settings saved in demo','This prototype has no persistent backend.'],'export-orders':['Export orders','Export will be available when real data storage is connected.'],'import-suppliers':['Import suppliers','Use a CSV/XLSX upload with source and verification fields.'],'add-supplier':['Add supplier','Add a supplier record with contact permission, service area, material capability and source.'],'open-request':['Request detail','Request details should include evidence, workflow state, supplier outreach, quotes, approval and activity.'],'open-supplier':['Supplier detail','View contact permissions, capability evidence, quote history and confirmed delivery outcomes.'],'voice-demo':['Voice entry demo','In production, Sarvam Voice Agents captures speech; Kovok validates and structures the requirement. No microphone/call is active here.'],'review-exceptions':['Exception review','Each exception must have a verified fact, owner, next action and closure condition.'],'refresh-quotes':['Refresh quote status','Production should re-confirm expired or stale offers with suppliers before approving them.'],'select-northline':['Supplier selected for approval','This is a demo action. No live quote or order is created.'],'clarify-quote':['Clarification requested','In production, Kovok would ask the supplier to confirm the missing unloading charge and keep the quote non-comparable.'],'simulate-story':['Example purchase flow','A site engineer requests 20 tonnes of Fe 550D steel for Monday; the owner approves the sourcing plan, and Kovok contacts eligible suppliers.'],'approve-quote':['Selected for approval','The next production step is a versioned approval for the exact supplier, specification, quantity, delivered total and terms.'],'import-csv':['Import CSV / Excel','Production setup should use an upload preview and data-quality report before importing records.']};const x=map[type]||['Prototype action', 'This action is not connected to a production backend yet.'];return `<div class="modal-head" style="padding:24px"><div><div class="eyebrow">PROTOTYPE ACTION</div><h2 id="modalTitle" style="margin:0;font-size:22px">${x[0]}</h2><p style="color:var(--muted);font-size:12px">${x[1]}</p></div><button class="icon-btn" data-action="close-modal">×</button></div><div class="wizard-footer"><span class="hint">Sample data only · no live supplier call or purchase</span><button class="btn btn-primary" data-action="close-modal">Got it</button></div>`}
function toast(msg){const old=document.querySelector('.toast');if(old)old.remove();const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3400)}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-page]');if(nav){state.page=nav.dataset.page;render();if(innerWidth<720)document.getElementById('sidebar').classList.remove('open');return}const cat=e.target.closest('[data-category]');if(cat){const c=cat.dataset.category;state.setup.categories=state.setup.categories.includes(c)?state.setup.categories.filter(x=>x!==c):[...state.setup.categories,c];const m=document.getElementById('modalInner');m.innerHTML=setupWizard();return}const tg=e.target.closest('[data-toggle-tag]');if(tg){tg.classList.toggle('selected');return}const vend=e.target.closest('[data-req-vendor]');if(vend){state.request.suppliers=vend.dataset.reqVendor;document.getElementById('modalInner').innerHTML=requestWizard();return}const a=e.target.closest('[data-action]');if(!a)return;const x=a.dataset.action;if(x==='new-request'){openModal('new-request')}else if(x==='setup'){openModal('setup')}else if(x==='close-modal'){closeModal()}else if(x==='setup-back'){state.setupStep=Math.max(0,state.setupStep-1);document.getElementById('modalInner').innerHTML=setupWizard()}else if(x==='setup-next'){if(state.setupStep<5){state.setupStep++;document.getElementById('modalInner').innerHTML=setupWizard()}else{document.getElementById('modalInner').innerHTML=`<div class="modal-head" style="padding:24px"><div><div class="eyebrow">WORKFLOW PREVIEW</div><h2 id="modalTitle" style="margin:0;font-size:23px">Your procurement profile is ready to review</h2><p style="color:var(--muted);font-size:12px">This is a demo-generated configuration. Live calls remain disabled until you connect and test the backend.</p></div><button class="icon-btn" data-action="close-modal">×</button></div><div class="wizard-main"><div class="panel"><div class="panel-head"><h2>${state.setup.company} · ${state.setup.businessType}</h2>${status('Draft configuration','blue')}</div><div class="panel-body"><div class="kv"><span>Materials</span><strong>${state.setup.categories.join(', ')}</strong></div><div class="kv"><span>Request source</span><strong>${state.setup.source}</strong></div><div class="kv"><span>Suppliers</span><strong>${state.setup.supplierList}</strong></div><div class="kv"><span>Ranking</span><strong>${state.setup.decision}</strong></div><div class="kv"><span>Approval</span><strong>${state.setup.approval}</strong></div><div class="kv"><span>Language</span><strong>${state.setup.language}</strong></div><div class="kv"><span>Call retry policy</span><strong>${state.setup.retries} attempts max</strong></div></div></div><div class="alert" style="margin-top:14px">Before activation, run test scenarios: missing specification, no-answer supplier, incomplete quote, changed price, supplier shortfall and late delivery. Owner approval is required to activate the profile.</div></div><div class="wizard-footer"><button class="btn btn-secondary" data-action="close-modal">Close preview</button><button class="btn btn-primary" data-action="activate-profile">Approve draft profile</button></div>`}}else if(x==='request-back'){state.requestStep=Math.max(0,state.requestStep-1);document.getElementById('modalInner').innerHTML=requestWizard()}else if(x==='request-next'){if(state.requestStep<3){state.requestStep++;document.getElementById('modalInner').innerHTML=requestWizard()}else{if(!document.getElementById('reviewConfirm')?.checked){toast('Please confirm the request before starting supplier outreach.');return}closeModal();toast('Demo request created. Live sourcing is not connected.');state.page='requests';render()}}else if(x==='activate-profile'){closeModal();toast('Demo profile approved locally. No live calls are enabled.')}else if(x==='open-recovery'){openModal('recovery')}else if(x==='simulate-recovery'){closeModal();state.page='quotations';render();toast('Demo state: alternative sourcing requested; no live supplier was contacted.')}else if(x==='open-product'||x==='propose-product'){openModal('product')}else if(x==='import-catalog'||x==='import-suppliers'||x==='import-csv'){openModal('import')}else{openModal(x)}});
document.addEventListener('input',e=>{if(e.target.matches('[data-req]'))state.request[e.target.dataset.req]=e.target.value;if(e.target.matches('[data-setup]'))state.setup[e.target.dataset.setup]=e.target.value});
document.getElementById('newRequest').addEventListener('click',()=>openModal('new-request'));document.getElementById('menuToggle').addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('open'));document.getElementById('helpBtn').addEventListener('click',()=>toast('Prototype help: use Configure procurement to explore onboarding, or New request to test the purchase flow.'));document.getElementById('globalSearch').addEventListener('keydown',e=>{if(e.key==='Enter'){const t=e.target.value.toLowerCase();state.page=t.includes('quote')?'quotations':t.includes('supplier')?'suppliers':t.includes('order')?'orders':t.includes('catalog')||t.includes('product')?'catalog':'requests';render();toast('Showing sample results for “'+e.target.value+'”.')}});document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});render();
</script>
</body></html>
